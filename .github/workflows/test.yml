name: Test Workflow

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Print Hello
      run: echo "Hello, GitHub Actions is working!"
    
    - name: List files
      run: ls -la
